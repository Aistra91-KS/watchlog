# Publie l'app web (dossier web/) sur GitHub Pages, après ses tests.
# À activer une fois : Settings > Pages > Source : « GitHub Actions ».
name: App web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests de l'app web
        working-directory: web
        run: node --test "tests/*.test.js"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers publiés (sans les tests)
        run: |
          mkdir _site
          cp -r web/index.html web/manifest.webmanifest web/robots.txt web/css web/js web/assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
