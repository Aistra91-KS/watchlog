# Tests de l'app Python (aucun appel réseau) à chaque push et pull request.
name: Tests Python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          WATCHLOG_OFFLINE: "1"
        run: python -m pytest -q
